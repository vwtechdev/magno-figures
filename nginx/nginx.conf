upstream django {
    server web:8000;
}

# Client IP behind Traefik (X-Forwarded-For first entry, else direct peer).
map $http_x_forwarded_for $client_ip {
    default $remote_addr;
    "~^(?P<first>[^,\s]+)" $first;
}

# Auth endpoints: 10 req/min per IP (login/register), 5 req/min (reset).
limit_req_zone $client_ip zone=auth:10m rate=10r/m;
limit_req_zone $client_ip zone=auth_strict:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name ${SERVER_NAME} www.${SERVER_NAME};

    client_max_body_size 50M;

    location /health {
        access_log off;
        return 200 "OK";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /accounts/login/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location = /accounts/register/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location = /accounts/password-reset/ {
        limit_req zone=auth_strict burst=3 nodelay;
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
    gzip_vary on;
}
